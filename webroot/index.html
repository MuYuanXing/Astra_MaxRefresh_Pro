<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Astra MaxRefresh Pro</title>
<link rel="stylesheet" href="internal/insets.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="lamp"></i><i class="grain"></i></div>

<main>
  <section class="page on" data-page="home">
    <header class="top">
      <div class="mark">Astra</div>
      <div class="status" id="status"><i class="led"></i><span id="status-text">读取中</span></div>
    </header>

    <div class="bezel">
      <div class="dial" id="dial">
        <div class="face"></div>
        <div class="zone" id="zone"></div>
        <div class="ticks" id="ticks"></div>
        <div class="window"><div class="roll" id="roll"></div></div>
        <div class="unit-print">Hz</div>
        <div class="ft"><span id="ft">--</span> 毫秒 / 帧</div>
        <div class="rotor" id="rotor"><div class="wob"><i class="trail"></i><i class="shadow"></i><i class="needle"></i></div></div>
        <i class="cap"></i>
        <i class="glass"></i>
        <i class="flash" id="flash"></i>
        <i class="wave"></i><i class="wave w2"></i>
      </div>
      <div class="pulse">
        <span class="pl">帧信号</span>
        <div class="train"><i id="train"></i></div>
        <span class="pr" id="pr">--</span>
      </div>
    </div>

    <div class="route"><span class="rt">切换路径</span><span class="rp" id="rp">—</span></div>

    <h2 class="sec">全局档位<small id="keys-hint">按下即生效</small></h2>
    <div id="keys"></div>

    <h2 class="sec">当前状态</h2>
    <div class="panel">
      <div class="row"><span>生效来源</span><b id="st-src">—</b></div>
      <div class="row"><span>前台应用</span><b id="st-app" class="ell">—</b></div>
      <div class="row"><span>分辨率</span><b id="st-res" class="num">—</b></div>
      <div class="row"><span>LTPO</span><b id="st-ltpo">—</b></div>
    </div>
  </section>

  <section class="page" data-page="rates">
    <header class="top"><h1>档位</h1></header>
    <p class="lead">超频档位从原生基准出发，按顺序逐级切换。点按档位说明可设为原生基准。</p>
    <div id="ladders"></div>
  </section>

  <section class="page" data-page="apps">
    <header class="top"><h1>应用</h1></header>
    <div class="panel">
      <div class="row"><span>按应用切换</span><label class="sw"><input type="checkbox" id="app-sw"><i></i></label></div>
      <div class="row"><span>检测间隔</span><div class="stepper"><button data-step="-1">−</button><b class="num" id="app-iv">1 秒</b><button data-step="1">+</button></div></div>
    </div>
    <h2 class="sec">规则<small id="rule-count"></small></h2>
    <div class="panel" id="rules"></div>
  </section>

  <section class="page" data-page="set">
    <header class="top"><h1>设置</h1></header>
    <h2 class="sec">显示</h2>
    <div class="panel">
      <div class="row"><span>外观</span><div class="seg" id="seg-theme"><b data-v="auto">跟随系统</b><b data-v="light">浅色</b><b data-v="dark">深色</b></div></div>
      <div class="row"><span>动画</span><div class="seg" id="seg-motion"><b data-v="full">完整</b><b data-v="lite">精简</b><b data-v="off">关闭</b></div></div>
    </div>
    <h2 class="sec">最近切换</h2>
    <ul class="panel log" id="recent"></ul>
    <h2 class="sec">模块</h2>
    <div class="panel">
      <div class="row"><span>LTPO 模式</span><b id="set-ltpo">—</b></div>
      <button class="row link" id="open-log"><span>运行记录</span><b>查看</b></button>
      <button class="row link danger" id="reset-all"><span>清除全部配置</span><b></b></button>
    </div>
    <p class="foot" id="foot">Astra MaxRefresh Pro</p>
  </section>
</main>

<div class="dock" data-for="rates"><button class="btn" id="rescan">重新扫描</button><button class="btn solid" id="save-rates">保存档位配置</button></div>
<div class="dock" data-for="apps"><button class="btn solid" id="add-rule">添加规则</button></div>

<nav class="tabs">
  <i class="tab-ind" id="tab-ind"></i>
  <button class="tab on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3.5 17.5a8.5 8.5 0 1 1 17 0"/><path d="M6.4 11.6l1.3.8M12 6.4v1.5M17.6 11.6l-1.3.8"/><path class="hl" d="M12 17.5l4.6-5.4"/><circle cx="12" cy="17.5" r="1.5"/></svg>首页</button>
  <button class="tab" data-go="rates"><svg viewBox="0 0 24 24"><path d="M6 6v12M12 6v12M18 6v6M6 12h12"/><circle cx="6" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="18" cy="5" r="1.6"/><circle class="hl fill" cx="18" cy="12" r="2.2"/></svg>档位</button>
  <button class="tab" data-go="apps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect class="hl" x="13" y="13" width="7" height="7" rx="2"/></svg>应用</button>
  <button class="tab" data-go="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="6"/><path class="hl" d="M12 13.5l3.2-3.2"/><path d="M12 3v2M5 6.2l1.3 1.3M19 6.2l-1.3 1.3M3 13.5h2M19 13.5h2"/></svg>设置</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><i class="grip"></i><div class="sheet-body" id="sheet-body"></div></div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
